[metadata]
name = lifeos-cli
version = attr: lifeos.VERSION
description = 本地优先的个人工作事实、辅助证据与报告 CLI
long_description = file: README.md
long_description_content_type = text/markdown
author = Amon Liu
license = Apache-2.0
license_files = LICENSE
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Console
    Operating System :: MacOS
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.13

[options]
python_requires = >=3.9
packages = find:
py_modules =
    lifeos
    lifeos_modules
include_package_data = True

[options.packages.find]
include =
    lifeos_config*
    lifeos_dchat*
    lifeos_git*
    lifeos_projects*
    lifeos_reports*
    lifeos_sessions*
    lifeos_work*
    lifeos_web*

[options.package_data]
lifeos_web =
    static/*.html
    static/*.css
    static/*.js
    static/*.svg
    static/fonts/*.ttf
    static/fonts/*.txt

[options.entry_points]
console_scripts =
    lifeos = lifeos:cli
